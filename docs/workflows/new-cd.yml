name: CD Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tu-app-backend
  EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_OIDC_ROLE_ARN }}

permissions:
  id-token: write # Requerido para OIDC de AWS
  contents: read

jobs:
  build-and-push:
    name: Build & Push ARM64 to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Image URI
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-via-ssm:
    name: Deploy to EC2 via AWS SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Deployment Commands via SSM
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $(echo $IMAGE_URI | cut -d/ -f1)\",
              \"docker pull $IMAGE_URI\",
              \"aws ssm get-parameters-by-path --path /app/prod/ --with-decryption --query 'Parameters[*].[Name,Value]' --output text | awk '{split(\\\$1,a,\\\"/\\\"); print a[length(a)]\\\"=\\\"\\\$2}' > /home/ubuntu/.env.app\",
              \"docker stop app || true\",
              \"docker rm app || true\",
              \"docker run -d --name app --restart unless-stopped --env-file /home/ubuntu/.env.app -p 8080:8080 $IMAGE_URI\",
              \"rm -f /home/ubuntu/.env.app\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Waiting for SSM command: $COMMAND_ID to finish..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment failed with status: $STATUS" >&2
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text >&2
            exit 1
          fi

          echo "Deployment successful."