services:
  alloy:
    image: grafana/alloy:v1.6.1
    restart: unless-stopped
    user: root
    environment:
      NEVERSION_API_TARGET: ${NEVERSION_API_TARGET:-neversion-api:8080}
      NEVERSION_MONITORING_SCRAPE_TOKEN: ${NEVERSION_MONITORING_SCRAPE_TOKEN}
      GRAFANA_CLOUD_REMOTE_WRITE_URL: ${GRAFANA_CLOUD_REMOTE_WRITE_URL}
      GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${GRAFANA_CLOUD_PROMETHEUS_USERNAME}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USERNAME: ${GRAFANA_CLOUD_LOKI_USERNAME}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        cat > /tmp/config.alloy <<'EOF'
        logging {
          level  = "info"
          format = "logfmt"
        }

        // --- Metrics Scraping ---
        prometheus.scrape "neversion_api" {
          targets = [{
            __address__ = sys.env("NEVERSION_API_TARGET"),
            job         = "neversion-api",
            application = "neversion-api",
            environment = "production",
          }]

          metrics_path    = "/actuator/prometheus"
          scrape_interval = "30s"

          authorization {
            type        = "Bearer"
            credentials = sys.env("NEVERSION_MONITORING_SCRAPE_TOKEN")
          }

          forward_to = [prometheus.remote_write.grafana_cloud.receiver]
        }

        prometheus.remote_write "grafana_cloud" {
          endpoint {
            url = sys.env("GRAFANA_CLOUD_REMOTE_WRITE_URL")

            basic_auth {
              username = sys.env("GRAFANA_CLOUD_PROMETHEUS_USERNAME")
              password = sys.env("GRAFANA_CLOUD_API_KEY")
            }
          }
        }

        // --- Logs Scraping ---
        discovery.docker "containers" {
          host = "unix:///var/run/docker.sock"
        }

        discovery.relabel "filter_neversion" {
          targets = discovery.docker.containers.targets

          rule {
            source_labels = ["__meta_docker_container_name"]
            regex         = "/neversion.*"
            action        = "keep"
          }

          rule {
            source_labels = ["__meta_docker_container_name"]
            target_label  = "container"
          }
        }

        loki.source.docker "neversion_logs" {
          host       = "unix:///var/run/docker.sock"
          targets    = discovery.relabel.filter_neversion.output
          forward_to = [loki.write.grafana_cloud.receiver]
        }

        loki.write "grafana_cloud" {
          endpoint {
            url = sys.env("GRAFANA_CLOUD_LOKI_URL")

            basic_auth {
              username = sys.env("GRAFANA_CLOUD_LOKI_USERNAME")
              password = sys.env("GRAFANA_CLOUD_API_KEY")
            }
          }
        }
        EOF

        exec /bin/alloy run \
          --server.http.listen-addr=0.0.0.0:12345 \
          --storage.path=/var/lib/alloy/data \
          /tmp/config.alloy
    volumes:
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "12345"
    networks:
      - neversion-network
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  alloy_data:

networks:
  neversion-network:
    external: true
