# ══════════════════════════════════════════════════════════════════
# Prometheus Configuration
#
# Prometheus scrapes metrics from the Spring Boot application's
# Actuator endpoint at /actuator/prometheus every 15 seconds.
# These metrics include: HTTP request durations, JVM memory/GC,
# HikariCP connection pool, and custom business metrics.
# ══════════════════════════════════════════════════════════════════

global:
  # How often Prometheus collects metrics from each target.
  # 15s is a good balance between granularity and resource usage.
  scrape_interval: 15s

  # How often Prometheus evaluates alert rules (if configured).
  evaluation_interval: 15s

scrape_configs:
  # ── Spring Boot Application ─────────────────────────────────────
  - job_name: "panel-api"
    # The /actuator/prometheus endpoint returns metrics in Prometheus
    # text format (counters, gauges, histograms, summaries).
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/scrape_token

    # Target is the Docker service name + internal port.
    # In Dokploy this must be the API service/container name on the shared
    # private Docker network.
    static_configs:
      - targets: ["neversion-api-app:8080"]
        labels:
          application: "neversion-api"
          environment: "production"
