# ══════════════════════════════════════════════════════════════════
# Docker Compose — API + DB (Isolated Stack)
# Purpose: Local development of the backend only.
# Use this when you want to run Panel and Store separately.
# ══════════════════════════════════════════════════════════════════

services:
  # ── Local PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:17
    container_name: neversion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neversiondb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neversiondb}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API — Spring Boot ────────────────────────────────────────────
  api:
    build: .
    container_name: neversion-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/neversiondb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mysecretpassword}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-dev-jwt-secret}
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
      # CORS: Defaults for Panel (4200) and Store (4000)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4000}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder}
      NEVERSION_EMAIL_FROM: ${NEVERSION_EMAIL_FROM:-Neversion <noreply@neversion.com>}
      NEVERSION_RENEWAL_GRACE_PERIOD_DAYS: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS:-2}
      NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED:-true}
      NEVERSION_CRON_NOTIFICATION_WORKER_ENABLED: ${NEVERSION_CRON_NOTIFICATION_WORKER_ENABLED:-false}
      NEVERSION_CRON_NOTIFICATION_WORKER_INTERVAL_MS: ${NEVERSION_CRON_NOTIFICATION_WORKER_INTERVAL_MS:-30000}
      NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED:-false}
    ports:
      - "8080:8080"

volumes:
  pgdata:
