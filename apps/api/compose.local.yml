# ══════════════════════════════════════════════════════════════════
# Docker Compose — DEV profile
# Purpose: Local development on your machine.
# Includes a local PostgreSQL container so you don't need
# an external database for development.
# ══════════════════════════════════════════════════════════════════

services:
  # ── Local PostgreSQL (dev only) ─────────────────────────────────
  db:
    image: postgres:17
    container_name: neversion-db
    restart: "no"
    environment:
      POSTGRES_DB: neversiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d neversiondb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Spring Boot Application ─────────────────────────────────────
  app:
    build: .
    container_name: neversion-app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      # Activate dev profile (local DB, SQL logging, Swagger enabled)
      SPRING_PROFILES_ACTIVE: dev
      # Connect to the local PostgreSQL container using its service name
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/neversiondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecretpassword
      # Supabase JWT secret for local testing
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-dev-jwt-secret}
      # CORS: allow all origins in dev
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

volumes:
  pgdata:
