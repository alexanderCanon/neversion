spring:
  application:
    name: api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false


  flyway:
    enabled: true
    execute-in-transaction: false
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.neversion.api.config: DEBUG

supabase:
  jwt:
    secret: ${SUPABASE_JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

neversion:
  renewal:
    grace-period-days: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS:2}
  cron:
    subscription-expiry:
      enabled: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED:true}
    notification-worker:
      enabled: ${NEVERSION_CRON_NOTIFICATION_WORKER_ENABLED:false}
      interval-ms: ${NEVERSION_CRON_NOTIFICATION_WORKER_INTERVAL_MS:30000}
    renewal-reminders:
      enabled: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED:false}
  email:
    resend:
      api-key: ${RESEND_API_KEY:re_placeholder}
    from: ${NEVERSION_EMAIL_FROM:Neversion <noreply@neversion.com>}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
