spring:
  application:
    name: api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    execute-in-transaction: false
    validate-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO

auth:
  api-url: ${AUTH_API_URL}
  admin-key: ${AUTH_ADMIN_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

neversion:
  gateway:
    secret: ${NEVERSION_GATEWAY_SECRET}
  renewal:
    grace-period-days: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS:2}
  cron:
    subscription-expiry:
      enabled: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED:true}
      schedule: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_SCHEDULE:0 0 8 * * *}
    notification-worker:
      enabled: ${NEVERSION_CRON_NOTIFICATION_WORKER_ENABLED:false}
      interval-ms: ${NEVERSION_CRON_NOTIFICATION_WORKER_INTERVAL_MS:30000}
    renewal-reminders:
      enabled: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED:false}
    inventory-reconciliation:
      enabled: ${NEVERSION_CRON_INVENTORY_RECONCILIATION_ENABLED:false}
      schedule: ${NEVERSION_CRON_INVENTORY_RECONCILIATION_SCHEDULE:0 30 3 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
