spring:
  datasource:
    # PostgreSQL Datasource configuration.
    # Note: If using a connection pooler like PgBouncer in transaction mode, make sure to append
    # ?preparedStatementCacheQueries=0&preparedStatementCacheSizeMiB=0 to the URL.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      keepalive-time: 60000
      validation-timeout: 3000
      pool-name: panel-db-pool
      data-source-properties:
        stringtype: unspecified

  flyway:
    enabled: true
    execute-in-transaction: false
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful

logging:
  level:
    root: INFO
  structured:
    format:
      console: ecs

auth:
  api-url: ${AUTH_API_URL}
  admin-key: ${AUTH_ADMIN_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

neversion:
  gateway:
    secret: ${NEVERSION_GATEWAY_SECRET}
  renewal:
    grace-period-days: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS:2}
  cron:
    subscription-expiry:
      enabled: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED:true}
      schedule: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_SCHEDULE:0 0 8 * * *}
    renewal-reminders:
      enabled: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED:true}


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
