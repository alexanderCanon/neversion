spring:
  datasource:
    # Session Pooler (IPv4-compatible). Get values from Supabase → Settings → Database → Session Pooler.
    # URL format:     jdbc:postgresql://aws-0-REGION.pooler.supabase.com:5432/postgres?preparedStatementCacheQueries=0&preparedStatementCacheSizeMiB=0
    # Username format: postgres.PROJECTREF  (NOT just "postgres")
    # Password:        your Supabase DB password
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      keepalive-time: 60000
      validation-timeout: 3000
      pool-name: panel-db-pool
      data-source-properties:
        stringtype: unspecified

  flyway:
    enabled: true
    execute-in-transaction: false
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful

logging:
  level:
    root: WARN

supabase:
  jwt:
    secret: ${SUPABASE_JWT_SECRET}
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

neversion:
  renewal:
    grace-period-days: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS:2}
  cron:
    subscription-expiry:
      enabled: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED:true}
    notification-worker:
      enabled: ${NEVERSION_CRON_NOTIFICATION_WORKER_ENABLED:true}
      interval-ms: ${NEVERSION_CRON_NOTIFICATION_WORKER_INTERVAL_MS:30000}
    renewal-reminders:
      enabled: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED:true}
  email:
    resend:
      api-key: ${RESEND_API_KEY}
    from: ${NEVERSION_EMAIL_FROM:Neversion <noreply@neversion.com>}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
