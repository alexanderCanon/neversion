spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neversiondb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:mysecretpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      keepalive-time: 60000
      validation-timeout: 3000
      pool-name: panel-db-pool
      data-source-properties:
        stringtype: unspecified

  flyway:
    enabled: true
    execute-in-transaction: false
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

auth:
  api-url: ${AUTH_API_URL:http://localhost:9999}
  admin-key: ${AUTH_ADMIN_KEY:your-dev-service-role-key}

neversion:
  gateway:
    secret: ${NEVERSION_GATEWAY_SECRET:dev-gateway-secret-change-in-prod}
  renewal:
    grace-period-days: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS:2}
  cron:
    subscription-expiry:
      enabled: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED:true}
    renewal-reminders:
      enabled: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED:true}