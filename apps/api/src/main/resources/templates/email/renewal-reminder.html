<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Recordatorio de Renovación</title></head>
<body style="margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background-color:#f4f4f7;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f7;padding:40px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                <tr>
                    <td style="background:linear-gradient(135deg,#f59e0b,#d97706);padding:32px 40px;text-align:center;">
                        <h1 style="margin:0;color:#ffffff;font-size:24px;font-weight:700;">⏰ Recordatorio de Renovación</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 40px;">
                        <p style="margin:0 0 16px;color:#374151;font-size:16px;line-height:1.6;">
                            Hola <strong th:text="${clientName != null ? clientName : 'Cliente'}">Cliente</strong>,
                        </p>
                        <p style="margin:0 0 16px;color:#374151;font-size:16px;line-height:1.6;">
                            Tu suscripción a <strong th:text="${serviceName != null ? serviceName : 'tu servicio'}">Servicio</strong>
                            vence el <strong th:text="${paymentDueDate != null ? paymentDueDate : 'próximamente'}">fecha</strong>.
                        </p>
                        <div style="background-color:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:16px;margin:16px 0;text-align:center;">
                            <p style="margin:0;color:#92400e;font-size:18px;font-weight:700;"
                               th:text="${daysRemaining != null ? daysRemaining + ' días restantes' : 'Próximo a vencer'}">
                                X días restantes
                            </p>
                        </div>
                        <p style="margin:0;color:#6b7280;font-size:14px;">
                            Para renovar, contacta a tu vendedor y realiza el pago antes de la fecha de vencimiento.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 40px;background-color:#f9fafb;text-align:center;border-top:1px solid #e5e7eb;">
                        <p style="margin:0;color:#9ca3af;font-size:12px;">© 2026 Neversion. Todos los derechos reservados.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
