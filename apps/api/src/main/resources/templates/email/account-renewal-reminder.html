<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Recordatorio de Renovación de Cuenta Matriz</title></head>
<body style="margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background-color:#f4f4f7;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f7;padding:40px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                <tr>
                    <td style="background:linear-gradient(135deg,#2563eb,#0f766e);padding:32px 40px;text-align:center;">
                        <h1 style="margin:0;color:#ffffff;font-size:24px;font-weight:700;">Recordatorio de renovación</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 40px;">
                        <p style="margin:0 0 16px;color:#374151;font-size:16px;line-height:1.6;">
                            Hola <strong th:text="${storeName != null ? storeName : 'vendedor'}">vendedor</strong>,
                        </p>
                        <p style="margin:0 0 16px;color:#374151;font-size:16px;line-height:1.6;">
                            La cuenta matriz de <strong th:text="${serviceName != null ? serviceName : 'tu servicio'}">Servicio</strong>
                            debe renovarse el <strong th:text="${renewalDate != null ? renewalDate : 'próximamente'}">fecha</strong>.
                        </p>
                        <div style="background-color:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:16px;margin:16px 0;">
                            <p style="margin:0 0 8px;color:#1e40af;font-size:16px;font-weight:700;"
                               th:text="${daysRemaining == 0 ? 'La renovación es hoy' : daysRemaining + ' días restantes'}">
                                Días restantes
                            </p>
                            <p style="margin:0;color:#374151;font-size:14px;">
                                Cuenta: <strong th:text="${accountEmail != null ? accountEmail : 'Sin correo registrado'}">correo</strong>
                            </p>
                        </div>
                        <p style="margin:0;color:#6b7280;font-size:14px;">
                            Revisa el pago con tu distribuidor para evitar interrupciones a tus clientes.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 40px;background-color:#f9fafb;text-align:center;border-top:1px solid #e5e7eb;">
                        <p style="margin:0;color:#9ca3af;font-size:12px;">© 2026 Neversion. Todos los derechos reservados.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
