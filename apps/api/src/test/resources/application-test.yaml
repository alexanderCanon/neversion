spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  api-url: http://localhost:8000
  admin-key: test-service-role-key-placeholder

neversion:
  gateway:
    secret: ${NEVERSION_GATEWAY_SECRET:test-gateway-secret-change-in-prod}
  renewal:
    grace-period-days: 2
  cron:
    subscription-expiry:
      enabled: false
    renewal-reminders:
      enabled: false
    reservation-expiry:
      enabled: false
    inventory-reconciliation:
      enabled: false
