spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

supabase:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-min-256-bits!!

neversion:
