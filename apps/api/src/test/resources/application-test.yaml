spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  api-url: http://localhost:8000
  admin-key: test-service-role-key-placeholder
  jwt:
    secret: test-secret-key-for-testing-purposes-only-min-256-bits!!

neversion:
  monitoring:
    scrape-token: test-prometheus-scrape-token
  renewal:
    grace-period-days: 2
  cron:
    subscription-expiry:
      enabled: false
    notification-worker:
      enabled: false
    renewal-reminders:
      enabled: false
    reservation-expiry:
      enabled: true
  reservation-service:
    enabled: false
  email:
    resend:
      api-key: re_test_placeholder
    from: "Test <test@neversion.com>"
