services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_API_URL: ${AUTH_API_URL}
      AUTH_ADMIN_KEY: ${AUTH_ADMIN_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      NEVERSION_RENEWAL_GRACE_PERIOD_DAYS: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS}
      NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED}
      NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED}
      NEVERSION_MONITORING_SCRAPE_TOKEN: ${NEVERSION_MONITORING_SCRAPE_TOKEN}
      NEVERSION_NOTIFICATION_SERVICE_HOST: ${NEVERSION_NOTIFICATION_SERVICE_HOST}
      NEVERSION_NOTIFICATION_SERVICE_PORT: ${NEVERSION_NOTIFICATION_SERVICE_PORT}
    ports:
      - "127.0.0.1:8080:8080"  # Only reachable from Traefik on the same host — not from the public internet
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - neversion-network
      - dokploy-network
    labels:
      - "traefik.enable=true"

      # ── Rate Limiting ───────────────────────────────────────────────────────
      # Max 100 requests/second average per IP, burst up to 50 extra requests.
      # Adjust values if legitimate clients need higher throughput.
      - "traefik.http.middlewares.${API_SERVICE_NAME}-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"

      # ── Security Headers ────────────────────────────────────────────────────
      # Injected at the Traefik edge so they apply to every response.
      - "traefik.http.middlewares.${API_SERVICE_NAME}-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.${API_SERVICE_NAME}-headers.headers.customResponseHeaders.X-XSS-Protection=0"

      # ── HTTP Traffic Routing ─────────────────────────────────────────────────
      - "traefik.http.routers.${API_SERVICE_NAME}-http.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.${API_SERVICE_NAME}-http.entrypoints=web"

      # ── HTTPS Traffic Routing ────────────────────────────────────────────────
      - "traefik.http.routers.${API_SERVICE_NAME}-https.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.${API_SERVICE_NAME}-https.entrypoints=websecure"
      - "traefik.http.routers.${API_SERVICE_NAME}-https.tls=true"
      - "traefik.http.routers.${API_SERVICE_NAME}-https.tls.certresolver=letsencrypt"
      # Apply rate-limit + security-headers middlewares on HTTPS
      - "traefik.http.routers.${API_SERVICE_NAME}-https.middlewares=${API_SERVICE_NAME}-ratelimit,${API_SERVICE_NAME}-headers"

      # ── Load Balancer ────────────────────────────────────────────────────────
      - "traefik.http.services.${API_SERVICE_NAME}-service.loadbalancer.server.port=${API_INTERNAL_PORT:-8080}"

networks:
  neversion-network:
    external: true
  dokploy-network:
    external: true