# ══════════════════════════════════════════════════════════════════
# Docker Compose — Dokploy deployment
#
# Purpose: Production deployment managed by Dokploy.
# - Dokploy builds the image from the Dockerfile in this directory.
# - Dokploy handles reverse proxy (Traefik), SSL, and env var injection.
# - NO database container (PostgreSQL lives in Supabase).
# - NO Nginx/Certbot (Dokploy's Traefik handles TLS termination).
# - NO Prometheus/Grafana (add as separate Dokploy services if needed).
#
# Dokploy setup:
#   - Source: GitHub repo root
#   - Branch: main
#   - Watch Path: apps/api/**
#   - Build Path: apps/api
#   - Compose file: apps/api/compose.prod.yml
# ══════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ── Spring profile ──────────────────────────────────────────
      # Activates application-prod.yaml (Swagger disabled, WARN logging,
      # HikariCP tuned, Flyway baseline-on-migrate false)
      SPRING_PROFILES_ACTIVE: prod

      # ── Database (Supabase PostgreSQL) ──────────────────────────
      # Direct connection → Supabase project → Settings → Database → URI
      # Use the "Transaction" pooler URI (port 5432) for JPA compatibility.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # ── Supabase Auth ───────────────────────────────────────────
      # Supabase project → Settings → API → JWT Secret
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # ── CORS ────────────────────────────────────────────────────
      # Comma-separated allowed frontend origins (no trailing slash).
      # Example: https://panel.neversion.com,https://neversion.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # ── Notifications (Resend) ──────────────────────────────────
      RESEND_API_KEY: ${RESEND_API_KEY}
      NEVERSION_EMAIL_FROM: ${NEVERSION_EMAIL_FROM}

      # ── Server ──────────────────────────────────────────────────
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    networks:
      neversion-internal:
        aliases:
          - neversion-api
      dokploy-network:

    # ── Memory ──────────────────────────────────────────────────
    # JVM -XX:MaxRAMPercentage=75.0 caps heap at ~576MB (75% of 768m).
    # Spring Boot 3 startup (context + Flyway 24 migrations + JIT) needs ~450MB peak.
    # Bump to 1g if OOM persists under load.
    deploy:
      resources:
        limits:
          memory: 768m

    # ── Health check for Dokploy ────────────────────────────────
    # Dokploy uses this to verify the container is ready before
    # routing traffic. Matches the /actuator/health public endpoint.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  neversion-internal:
    external: true
  dokploy-network:
    external: true
