# ══════════════════════════════════════════════════════════════════
# Docker Compose — PROD profile (EC2 deployment)
#
# Purpose: Production deployment on an EC2 instance.
# - NO database container (PostgreSQL lives in Supabase)
# - ALL secrets are placeholders — inject via .env file or CI
# - Includes Prometheus + Grafana for observability
#
# Usage:
#   1. Create a .env file with your secrets (see .env.example)
#   2. docker compose -f docker-compose.prod.yaml up -d
#
# ══════════════════════════════════════════════════════════════════

services:
  # ── Spring Boot Application ─────────────────────────────────────
  app:
    image: 163053485479.dkr.ecr.us-east-2.amazonaws.com/mi-app-backend:latest
    container_name: panel-app
    restart: unless-stopped
    environment:
      # ── Spring profile ──────────────────────────────────────────
      # Activates application-prod.yaml (Swagger disabled, WARN logging)
      SPRING_PROFILES_ACTIVE: prod

      # ── Database (Supabase PostgreSQL) ──────────────────────────
      # Direct connection to your Supabase PostgreSQL instance.
      # Format: jdbc:postgresql://HOST:PORT/DATABASE
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # ── Supabase Auth ───────────────────────────────────────────
      # JWT secret from Supabase project settings → API → JWT Secret
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}

      # ── CORS ────────────────────────────────────────────────────
      # Comma-separated list of allowed frontend origins.
      # Example: https://yourdomain.com,https://www.yourdomain.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # ── Server ──────────────────────────────────────────────────
      SERVER_PORT: 8080
    # ── Memory limit ────────────────────────────────────────────
    # Restricts the container to 512MB RAM. The JVM's
    # -XX:MaxRAMPercentage=75.0 will cap heap at ~384MB,
    # leaving 128MB for metaspace, threads, and OS overhead.
    # Adjust based on your EC2 instance size.
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - monitoring

  # ── Prometheus (Metrics Collector) ──────────────────────────────
  # Prometheus scrapes the /actuator/prometheus endpoint every 15s
  # and stores time-series metrics (HTTP request rates, JVM memory,
  # garbage collection, connection pool stats, etc.)
  prometheus:
    image: prom/prometheus:latest
    container_name: panel-prometheus
    restart: unless-stopped
    volumes:
      # Mount the scrape configuration file
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Persist metrics data across container restarts
      - prometheus_data:/prometheus
    networks:
      - monitoring

  # ── Grafana (Dashboards & Visualization) ────────────────────────
  # Grafana reads metrics from Prometheus and renders dashboards.
  # Pre-configured with Prometheus as a data source via provisioning.
  grafana:
    image: grafana/grafana:latest
    container_name: panel-grafana
    restart: unless-stopped
    environment:
      # Default admin credentials (change after first login!)
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      # Auto-provision Prometheus as a data source on first boot
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # Persist dashboards and settings across restarts
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ── Nginx (Reverse Proxy) ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: panel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - monitoring

  # ── Certbot (SSL Certificates) ──────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: panel-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
