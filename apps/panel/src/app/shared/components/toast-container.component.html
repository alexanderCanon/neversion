<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast show" role="alert" [ngClass]="'toast-' + toast.type" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2">
          <i [class]="iconMap[toast.type]"></i>
          {{ toast.message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="dismiss(toast)" aria-label="Close"></button>
      </div>
    </div>
  }
</div>
