<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Correo electrónico</label>
        <input id="email" type="email" class="form-control" formControlName="email" placeholder="correo@ejemplo.com" autocomplete="email">
        @if(loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <div class="text-danger small mt-1">El correo es obligatorio.</div>
        }
    </div>

    <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <input id="password" type="password" class="form-control" formControlName="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
        @if(loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <div class="text-danger small mt-1">Mínimo 6 caracteres.</div>
        }
    </div>

    @if(errorMessage) {
        <div class="alert alert-danger d-flex align-items-start gap-2 p-3 small mb-4" role="alert">
            <i class="bi bi-exclamation-circle-fill flex-shrink-0" aria-hidden="true"></i>
            {{ errorMessage }}
        </div>
    }

    <button type="submit" class="btn btn-primary w-100 login-btn" [disabled]="loginForm.invalid || isLoading">
        @if(isLoading) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Ingresando...
        } @else {
            Ingresar
        }
    </button>
</form>
