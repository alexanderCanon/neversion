<div class="container-fluid p-4">
  <!-- Page Header -->
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
    <div>
      <h1 class="h3 fw-bold text-dark mb-1">Catálogo de Juegos</h1>
      <p class="text-muted mb-0 small">Administra los juegos y diamantes/monedas de tu tienda.</p>
    </div>
    
    <div>
      <button class="btn btn-primary d-inline-flex align-items-center gap-2 px-4 py-2-5 rounded-3 fw-semibold shadow-sm" (click)="openNewGameModal()">
        <i class="bi bi-plus-circle"></i>
        <span>Nuevo Juego</span>
      </button>
    </div>
  </div>

  <!-- Filters & Search -->
  <div class="row g-3 mb-4">
    <div class="col-md-8 col-lg-9">
      <div class="search-container position-relative">
        <i class="bi bi-search search-icon"></i>
        <input 
          type="text" 
          class="form-control search-input w-100" 
          placeholder="Buscar por nombre o código..."
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchChange($event)">
      </div>
    </div>
    <div class="col-md-4 col-lg-3">
      <select 
        class="form-select border-0 shadow-sm px-3" 
        [ngModel]="selectedStatus()"
        (ngModelChange)="onStatusChange($event)">
        <option value="">Todos los estados</option>
        <option value="active">Activos</option>
        <option value="inactive">Inactivos</option>
      </select>
    </div>
  </div>

  <!-- Table Container -->
  <div class="bg-white rounded-4 shadow-sm border overflow-hidden table-container">
    @if (isLoading()) {
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="text-muted mt-3 mb-0 small">Cargando juegos...</p>
      </div>
    } @else {
      @if (filteredGames().length > 0) {
        <app-games-table 
          [games]="filteredGames()" 
          (editGame)="onEditGame($event)" 
          (toggleStatus)="onToggleStatus($event)"
          (deleteGame)="onDeleteGame($event)">
        </app-games-table>
      } @else {
        <!-- Empty State -->
        <div class="text-center py-5 my-4 empty-state">
          <div class="empty-state-icon mb-3">
            <i class="bi bi-controller text-muted display-3 opacity-50"></i>
          </div>
          <h4 class="fw-semibold text-dark mb-1">No se encontraron juegos</h4>
          <p class="text-muted small mb-0">Intenta cambiar los filtros de búsqueda o agrega un nuevo juego al catálogo.</p>
        </div>
      }
    }
  </div>
</div>

<!-- Modal Form -->
<app-game-form (saveGame)="onSaveGame($event)"></app-game-form>
