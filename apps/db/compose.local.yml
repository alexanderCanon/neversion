services:
  db:
    image: postgres:17
    container_name: neversion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neversiondb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neversiondb}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neversion-network
volumes:
  pgdata:

networks:
  neversion-network:
    external: true