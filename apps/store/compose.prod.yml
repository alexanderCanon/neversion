services:
  store:
    build:
      context: ../..
      dockerfile: apps/store/Dockerfile
    restart: unless-stopped
    environment:
      STORE_API_URL: ${STORE_API_URL}
      STORE_SUPABASE_URL: ${STORE_SUPABASE_URL}
      STORE_SUPABASE_KEY: ${STORE_SUPABASE_KEY}
      STORE_VENDOR_UUID: ${STORE_VENDOR_UUID}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
