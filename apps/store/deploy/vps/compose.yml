services:
  store:
    image: ${STORE_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      STORE_API_URL: ${STORE_API_URL}
      STORE_SUPABASE_URL: ${STORE_SUPABASE_URL}
      STORE_SUPABASE_KEY: ${STORE_SUPABASE_KEY}
      STORE_VENDOR_UUID: ${STORE_VENDOR_UUID}
    expose:
      - "4000"
    networks:
      - store-network
    deploy:
      resources:
        limits:
          memory: 512m

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - store
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - store-network
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  store-network:

volumes:
  caddy_data:
  caddy_config:
