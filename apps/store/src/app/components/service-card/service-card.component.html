<div class="svc-card" [routerLink]="['/platforms', platforms?.id]">
  <div class="svc-card__img-wrapper">
    <img [src]="imageUrl" class="svc-card__img" [alt]="platforms?.name">
    <div class="svc-card__overlay">
      <span class="svc-card__cta">Ver detalles</span>
    </div>
  </div>

  <div class="svc-card__body">
    <h5 class="svc-card__name">{{ platforms?.name }}</h5>

    <div class="svc-card__pricing">
      <div class="svc-card__price-row">
        <span class="svc-card__price-label">Perfil</span>
        <span class="svc-card__price svc-card__price--profile">Q{{ platforms?.priceProfile }}</span>
      </div>
      <div class="svc-card__price-row">
        <span class="svc-card__price-label">Cuenta completa</span>
        <span class="svc-card__price svc-card__price--complete">Q{{ platforms?.priceComplete }}</span>
      </div>
    </div>
  </div>
</div>
