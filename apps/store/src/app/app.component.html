<app-toolbar></app-toolbar>
<router-outlet></router-outlet>

<!-- Toast Container - Moved to top-end to prevent overlapping the WhatsApp floating button -->
<div class="toast-container position-fixed top-0 end-0 p-3 p-md-4 mt-5 mt-md-0" style="z-index: 2000;">
  <div *ngFor="let toast of toasts$ | async" 
       class="toast show align-items-center border-0 shadow-lg rounded-4 mb-3" 
       [class.text-white]="toast.type !== 'info'"
       [class.bg-success]="toast.type === 'success'"
       [class.bg-danger]="toast.type === 'danger'"
       [class.bg-white]="toast.type === 'info'"
       role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex p-3">
      <div class="toast-body d-flex align-items-center">
        <i class="bi me-3 fs-4" 
           [class.bi-check-circle-fill]="toast.type === 'success'"
           [class.bi-exclamation-octagon-fill]="toast.type === 'danger'"
           [class.bi-info-circle-fill]="toast.type === 'info'"></i>
        <div>
          <strong *ngIf="toast.title" class="d-block">{{ toast.title }}</strong>
          {{ toast.message }}
        </div>
      </div>
      <button type="button" class="btn-close ms-auto me-2" 
              [class.btn-close-white]="toast.type !== 'info'"
              (click)="removeToast(toast)" aria-label="Close"></button>
    </div>
  </div>
</div>

<app-floating-whatsapp></app-floating-whatsapp>
<app-footer></app-footer>
