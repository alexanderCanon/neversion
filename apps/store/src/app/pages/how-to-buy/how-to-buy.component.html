<div class="how-to-buy-page bg-light min-vh-100 pb-5">
    <!-- Header -->
    <div class="bg-primary text-white py-5 mb-5 shadow-lg" 
         style="background: linear-gradient(135deg, var(--primary-color) 0%, var(--darkest-primary-color) 100%);">
        <div class="container py-5 text-center">
            <h1 class="display-4 fw-bold mb-3 text-white"><i class="bi bi-cart-check me-3"></i>¿Cómo comprar?</h1>
            <p class="lead opacity-75 fs-4">Sigue estos sencillos pasos para adquirir tus servicios digitales favoritos.</p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <!-- Steps Vertical Timeline -->
                <div class="position-relative ps-md-5">
                    <!-- Vertical Line (Desktop only) -->
                    <div class="d-none d-md-block position-absolute start-0 top-0 bottom-0 border-start border-3 border-primary-subtle opacity-25" style="left: 20px !important;"></div>

                    <div class="step-item position-relative mb-5" *ngFor="let step of steps; let i = index">
                        <!-- Step Bubble -->
                        <div class="d-none d-md-flex position-absolute start-0 translate-middle-x bg-white rounded-circle border border-4 border-primary align-items-center justify-content-center shadow-sm" 
                             style="width: 44px; height: 44px; left: -43px; z-index: 2;">
                            <span class="fw-bold text-primary">{{ i + 1 }}</span>
                        </div>

                        <div class="card border-0 shadow-sm rounded-4 overflow-hidden transition-all hover-grow">
                            <div class="card-body p-4 p-md-5">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="text-white rounded-circle d-flex align-items-center justify-content-center me-3 shadow" 
                                         style="background: var(--primary-color); width: 50px; height: 50px; min-width: 50px; flex-shrink: 0;">
                                        <i [class]="step.icon + ' fs-4'"></i>
                                    </div>
                                    <h3 class="fw-bold mb-0 text-dark">{{ step.title }}</h3>
                                </div>
                                <p class="text-muted fs-5 mb-0 lh-lg">
                                    {{ step.description }}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Final CTA -->
                <div class="card border-0 shadow-lg rounded-5 mt-5 overflow-hidden">
                    <div class="card-body p-5 text-center text-white" 
                         style="background: linear-gradient(135deg, var(--primary-color) 0%, var(--darkest-primary-color) 100%);">
                        <h2 class="fw-bold mb-4">¿Todo claro?</h2>
                        <p class="lead opacity-75 mb-5">Es el momento de disfrutar del mejor contenido digital.</p>
                        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                            <a routerLink="/platforms" class="btn btn-light btn-lg px-5 fw-bold shadow transition-all hover-grow" 
                               style="color: var(--primary-color);">
                                Ir a la Tienda <i class="bi bi-arrow-right ms-2"></i>
                            </a>
                            <a routerLink="/contact" class="btn btn-outline-light btn-lg px-5 fw-bold transition-all hover-grow">
                                Tengo Dudas
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
