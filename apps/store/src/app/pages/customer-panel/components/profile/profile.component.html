<div class="card shadow-sm mt-4">
  <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
    <h3 class="mb-0 fw-bold">Mi Perfil</h3>
    <p class="text-muted mb-0">Datos básicos de contacto</p>
  </div>

  <div class="card-body">
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-2 text-muted">Obteniendo tu perfil...</p>
    </div>

    <div *ngIf="error" class="alert alert-danger" role="alert">
      {{ error }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success" role="alert">
      {{ successMessage }}
    </div>

    <form *ngIf="!isLoading && profile" [formGroup]="form" (ngSubmit)="saveProfile()" class="row g-3">
      <div class="col-12 col-md-6">
        <label for="customerName" class="form-label">Nombre</label>
        <input id="customerName"
               type="text"
               class="form-control"
               [class.is-invalid]="isInvalid('name')"
               formControlName="name">
        <div class="invalid-feedback">Ingresa un nombre válido.</div>
      </div>

      <div class="col-12 col-md-6">
        <label for="customerPhone" class="form-label">Teléfono</label>
        <input id="customerPhone"
               type="tel"
               class="form-control"
               [class.is-invalid]="isInvalid('phone')"
               formControlName="phone">
        <div class="invalid-feedback">El teléfono no debe exceder 50 caracteres.</div>
      </div>

      <div class="col-12 col-md-6">
        <label for="customerEmail" class="form-label">Correo</label>
        <input id="customerEmail"
               type="email"
               class="form-control"
               [value]="profile.email || ''"
               readonly>
      </div>

      <div class="col-12 d-flex justify-content-end">
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-2"></span>
          {{ isSaving ? 'Guardando...' : 'Guardar cambios' }}
        </button>
      </div>
    </form>
  </div>
</div>
