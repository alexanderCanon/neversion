<div class="support-page bg-light min-vh-100 pb-5">
    <!-- Header -->
    <div class="bg-primary text-white py-5 mb-5 shadow-lg" 
         style="background: linear-gradient(135deg, var(--primary-color) 0%, var(--darkest-primary-color) 100%);">
        <div class="container py-5 text-center">
            <h1 class="display-4 fw-bold mb-3 text-white"><i class="bi bi-headset me-3"></i>Centro de Soporte</h1>
            <p class="lead opacity-75 fs-4">¿Tienes algún inconveniente? Estamos listos para ayudarte.</p>
        </div>
    </div>

    <div class="container">
        <!-- Support Channels -->
        <div class="row g-4 mb-5">
            <div class="col-md-4" *ngFor="let channel of supportChannels">
                <div class="card h-100 border-0 shadow-sm rounded-4 text-center p-4 transition-all hover-grow">
                    <div class="card-body">
                        <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-4 shadow-sm" 
                             [style.background-color]="channel.color" 
                             style="width: 70px; height: 70px; color: white;">
                            <i [class]="channel.icon + ' fs-2'"></i>
                        </div>
                        <h4 class="fw-bold mb-3">{{ channel.title }}</h4>
                        <p class="text-muted small mb-4">{{ channel.description }}</p>
                        <button (click)="handleAction(channel)" 
                                class="btn btn-outline-dark rounded-pill px-4 fw-bold w-100">
                            {{ channel.action }}
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- FAQ Section -->
        <div class="row justify-content-center mt-5">
            <div class="col-lg-8">
                <div class="text-center mb-5">
                    <h2 class="fw-bold">Preguntas Frecuentes</h2>
                    <p class="text-muted">Resuelve tus dudas rápidamente antes de contactarnos.</p>
                </div>

                <div class="accordion accordion-flush rounded-4 overflow-hidden shadow-sm" id="supportAccordion">
                    <div class="accordion-item border-bottom" *ngFor="let faq of faqs; let i = index">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed fw-bold py-4 px-4" type="button" 
                                    data-bs-toggle="collapse" [attr.data-bs-target]="'#faq-' + i">
                                {{ faq.q }}
                            </button>
                        </h2>
                        <div [id]="'faq-' + i" class="accordion-collapse collapse" data-bs-parent="#supportAccordion">
                            <div class="accordion-body py-4 px-4 text-muted lh-lg bg-white">
                                {{ faq.a }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Working Hours Info -->
        <div class="text-center mt-5 pt-4">
            <div class="p-4 bg-white rounded-4 d-inline-block shadow-sm border">
                <p class="mb-0 text-muted">
                    <i class="bi bi-clock-fill me-2 text-primary"></i>
                    <strong>Horario de atención:</strong> Lunes a Domingo, 8:00 AM - 10:00 PM (Hora de Guatemala)
                </p>
            </div>
        </div>
    </div>
</div>
