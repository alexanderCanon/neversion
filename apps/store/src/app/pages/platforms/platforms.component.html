<ul *ngIf="platforms$ | async as platforms">
    <li *ngFor="let platform of platforms">
        <strong>{{ platform.name }}</strong><br />
        {{ platform.description }}
        {{ platform.stock }}
        {{ platform.price | currency:'Q'}}
        {{ platform.s_type }}
        {{ platform.link }}
        {{ platform.is_active }}
        {{ platform.created_at }}
    </li>
</ul>
