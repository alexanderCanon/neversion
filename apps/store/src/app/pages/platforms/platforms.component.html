<div class="container py-5 mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Catálogo de Servicios</h2>
    </div>

    <ul class="list-unstyled row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" *ngIf="platforms$ | async as platforms">
        <li class="col" *ngFor="let platform of platforms">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <img [src]="platform.imageUrl || '/assets/placeholder-service.png'" [alt]="platform.name" 
                             class="rounded me-3" style="width: 60px; height: 60px; object-fit: cover;">
                        <h5 class="fw-bold mb-0">{{ platform.name }}</h5>
                    </div>
                    <p class="text-muted small mb-3">{{ platform.description }}</p>
                    <div class="pricing mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="small">Precio Perfil:</span>
                            <strong class="text-primary">Q{{ platform.priceProfile }}</strong>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="small">Cuenta Completa:</span>
                            <strong class="text-dark">Q{{ platform.priceComplete }}</strong>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <span class="badge bg-secondary-subtle text-secondary">{{ platform.category }}</span>
                        <span class="small text-muted">{{ platform.durationDays }} días</span>
                    </div>
                </div>
            </div>
        </li>
    </ul>

    <div *ngIf="(platforms$ | async)?.length === 0" class="text-center py-5">
        <i class="bi bi-inbox fs-1 text-muted"></i>
        <p class="mt-2 text-muted">No hay servicios disponibles en este momento.</p>
    </div>
</div>
