<section class="hero-section position-relative py-5 shadow-lg" 
         style="background: linear-gradient(135deg, var(--primary-color) 0%, var(--darkest-primary-color) 100%);">
  <div class="container px-4 py-5 my-5 text-center text-white">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="display-3 fw-bold mb-4">Bienvenido a Neversion</h1>
        <h2 class="h3 fw-light mb-4 opacity-90">La mejor experiencia de compra digital en un solo lugar</h2>
        <p class="lead mb-5 opacity-75 fs-4">
          Accede a las mejores plataformas de streaming, juegos y servicios con precios imbatibles y activación inmediata.
        </p>
        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
          <a routerLink="/platforms" class="btn btn-light btn-lg px-5 py-3 rounded-pill fw-bold shadow-lg transition-all hover-grow" 
             style="color: var(--primary-color);">
            Ver Catálogo <i class="bi bi-arrow-right ms-2"></i>
          </a>
          <a routerLink="/offers" class="btn btn-outline-light btn-lg px-5 py-3 rounded-pill fw-bold transition-all hover-grow">
            Ver Ofertas
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="container py-5 mt-4">
  <div class="d-flex align-items-center justify-content-between mb-5">
    <h2 class="fw-bold mb-0">Servicios Populares</h2>
    <a routerLink="/platforms" class="text-primary text-decoration-none fw-bold">Ver todos <i class="bi bi-chevron-right small"></i></a>
  </div>
  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
    <app-service-card *ngFor="let item of platforms$ | async" [platforms]="item"></app-service-card>
  </div>
</div>
