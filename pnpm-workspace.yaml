packages:
  - 'apps/*'
  - 'packages/*'
catalog:
  '@supabase/supabase-js': ^2.95.3
  bootstrap: ^5.3.8
  bootstrap-icons: ^1.13.1
  rxjs: ~7.8.0
  tslib: ^2.8.1
  typescript: ~5.9.3
  wrangler: ^4.125.0
  zone.js: ~0.15.0
allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nice-napi: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@alexandercanon/api-client-angular@1.0.0'
