# ══════════════════════════════════════════════════════════════════
# compose.local.yml — Stack completo para desarrollo local
#
# Levanta los 3 apps + base de datos con un solo comando.
#
# COMANDOS:
#   Todo el stack:     docker compose -f compose.local.yml up --build
#   Solo API + DB:     docker compose -f compose.local.yml up --build api db
#   Solo panel:        docker compose -f compose.local.yml up --build panel
#   Solo store:        docker compose -f compose.local.yml up --build store
#   Bajar todo:        docker compose -f compose.local.yml down
#   Limpiar volumes:   docker compose -f compose.local.yml down -v
#
# REQUISITOS:
#   Copiar .env de la API: cp apps/api/.env.example apps/api/.env
#   y completar las variables necesarias.
# ══════════════════════════════════════════════════════════════════

services:
  # ── Base de datos local (solo para API) ─────────────────────────
  db:
    image: postgres:16-alpine
    container_name: neversion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: neversiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d neversiondb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API — Spring Boot ────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: neversion-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/neversiondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecretpassword
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-dev-jwt-secret}
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

  # ── Panel — Angular 17 static (Nginx) ───────────────────────────
  panel:
    build:
      context: ./apps/panel
      dockerfile: Dockerfile
    container_name: neversion-panel
    restart: unless-stopped
    ports:
      - "4200:80"

  # ── Store — Angular 16 SSR (Node) ───────────────────────────────
  store:
    build:
      context: ./apps/store
      dockerfile: Dockerfile
    container_name: neversion-store
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "4000:4000"

volumes:
  pgdata:
