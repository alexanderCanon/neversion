# ══════════════════════════════════════════════════════════════════
# compose.local.yml — Stack completo para desarrollo local
#
# Levanta los 3 apps + base de datos con un solo comando.
#
# COMANDOS:
#   Preparar env:      cp infra/.env.example infra/.env
#   Todo el stack:     docker compose --env-file infra/.env -f infra/compose.local.yml up --build
#   Solo API + DB:     docker compose --env-file infra/.env -f infra/compose.local.yml up --build api db
#   Solo panel:        docker compose --env-file infra/.env -f infra/compose.local.yml up --build panel
#   Solo store:        docker compose --env-file infra/.env -f infra/compose.local.yml up --build store
#   Bajar todo:        docker compose --env-file infra/.env -f infra/compose.local.yml down
#   Limpiar volumes:   docker compose --env-file infra/.env -f infra/compose.local.yml down -v
#
# REQUISITOS:
#   Copiar .env local: cp infra/.env.example infra/.env
#   y completar Supabase/Resend si se probaran esos flujos.
# ══════════════════════════════════════════════════════════════════

services:
  # ── Base de datos local (solo para API) ─────────────────────────
  db:
    image: postgres:17
    container_name: neversion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neversiondb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neversiondb}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API — Spring Boot ────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: neversion-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/neversiondb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mysecretpassword}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-dev-jwt-secret}
      SUPABASE_URL: ${SUPABASE_URL:-http://gotrue:8081}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-dev-service-role-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4000}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder}
      NEVERSION_EMAIL_FROM: ${NEVERSION_EMAIL_FROM:-Neversion <noreply@neversion.com>}
      NEVERSION_RENEWAL_GRACE_PERIOD_DAYS: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS:-2}
      NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED:-true}
      NEVERSION_CRON_NOTIFICATION_WORKER_ENABLED: ${NEVERSION_CRON_NOTIFICATION_WORKER_ENABLED:-false}
      NEVERSION_CRON_NOTIFICATION_WORKER_INTERVAL_MS: ${NEVERSION_CRON_NOTIFICATION_WORKER_INTERVAL_MS:-30000}
      NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED:-false}
    ports:
      - "8080:8080"

  # ── GoTrue — Supabase Auth Local ────────────────────────────────
  gotrue:
    image: supabase/gotrue:v2.158.0
    container_name: neversion-gotrue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9999:8081"
    environment:
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_PORT: 8081
      GOTRUE_API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:mysecretpassword@db:5432/neversiondb?sslmode=disable
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-dev-jwt-secret}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_SITE_URL: http://localhost:4200
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@neversion.com

volumes:
  pgdata:
