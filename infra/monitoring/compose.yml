# ══════════════════════════════════════════════════════════════════
# Docker Compose — Monitoring Stack (Prometheus + Grafana)
#
# Purpose: Centralized observability for all Neversion services.
# Deployed as a SEPARATE Dokploy app — independent lifecycle from
# the API, Panel, and Store.
#
# Dokploy setup:
#   - Source: GitHub repo root
#   - Branch: main
#   - Watch Path: infra/monitoring/**   ← only redeploys if this changes
#   - Build Path: infra/monitoring
#   - Compose file: infra/monitoring/compose.yml
#   - Auto-deploy: OFF (update monitoring manually)
#
# ⚠  Grafana credentials: change GF_SECURITY_ADMIN_PASSWORD immediately
#    after first login. Store in Dokploy env vars, not here.
# ══════════════════════════════════════════════════════════════════

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: neversion-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"   # keep 15 days of metrics
      - "--web.enable-lifecycle"               # allow hot-reload via POST /-/reload
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"   # only expose if you need direct Prometheus access
                      # consider removing in prod and querying only via Grafana

  grafana:
    image: grafana/grafana:latest
    container_name: neversion-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}   # required — set in Dokploy env vars
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}                 # e.g. https://grafana.neversion.com
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
