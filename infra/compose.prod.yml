services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_API_URL: ${AUTH_API_URL}
      AUTH_ADMIN_KEY: ${AUTH_ADMIN_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      NEVERSION_RENEWAL_GRACE_PERIOD_DAYS: ${NEVERSION_RENEWAL_GRACE_PERIOD_DAYS}
      NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED: ${NEVERSION_CRON_SUBSCRIPTION_EXPIRY_ENABLED}
      NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED: ${NEVERSION_CRON_RENEWAL_REMINDERS_ENABLED}
      NEVERSION_MONITORING_SCRAPE_TOKEN: ${NEVERSION_MONITORING_SCRAPE_TOKEN}
      NEVERSION_NOTIFICATION_SERVICE_HOST: ${NEVERSION_NOTIFICATION_SERVICE_HOST}
      NEVERSION_NOTIFICATION_SERVICE_PORT: ${NEVERSION_NOTIFICATION_SERVICE_PORT}
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - neversion-network
      - dokploy-network

  notification-service:
    build:
      context: ..
      dockerfile: apps/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${NOTIFICATION_SERVICE_PORT}
      DATABASE_PATH: ${NOTIFICATION_SERVICE_DATABASE_PATH}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${NEVERSION_EMAIL_FROM}
    ports:
      - "50051:50051"
    volumes:
      - notification_data:/workspace/apps/notification-service/data
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - neversion-network

volumes:
  notification_data:

networks:
  neversion-network:
  dokploy-network:
    external: true
