name: CI — Store

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/store/**'
      - 'packages/**'
      - 'package.json'
      - 'eslint.config.js'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: ci-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Run linter
      #   run: pnpm --filter store run --if-present lint

      - name: Build SPA bundle
        run: pnpm --filter store build

  sca-security:
    name: Dependency Vulnerability Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/store'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: 1
