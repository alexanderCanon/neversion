name: CI — Store

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/store/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alexandercanon'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Cache Vite build cache
        uses: actions/cache@v4
        with:
          path: apps/store/node_modules/.vite
          key: vite-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/store/src/**') }}
          restore-keys: |
            vite-store-${{ runner.os }}-

      - name: Run unit tests
        run: pnpm --filter store test

      - name: Build SPA bundle
        run: pnpm --filter store build
