name: Desplegar recordatorios de Neversion Digital

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: neversion-digital-telegram
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@alexandercanon"
      - run: pnpm install --frozen-lockfile --filter neversion-telegram-reminder...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: pnpm --filter neversion-telegram-reminder test
      - run: pnpm --filter neversion-telegram-reminder exec wrangler deploy --config wrangler.digital.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
