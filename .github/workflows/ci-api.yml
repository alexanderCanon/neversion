name: CI — API

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        working-directory: apps/api
        run: chmod +x mvnw

      - name: Build and run tests
        working-directory: apps/api
        run: ./mvnw verify -B
