name: Deploy Panel to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/panel/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-panel.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Panel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alexandercanon'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build Panel for Cloudflare
        run: pnpm --filter panel run build:cloudflare
        env:
          PANEL_API_URL: ${{ secrets.PANEL_API_URL || vars.PANEL_API_URL }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL || vars.GRAFANA_URL }}
          PANEL_SUPABASE_URL: ${{ secrets.PANEL_SUPABASE_URL || vars.PANEL_SUPABASE_URL }}
          PANEL_SUPABASE_KEY: ${{ secrets.PANEL_SUPABASE_KEY || vars.PANEL_SUPABASE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/panel'
          command: pages deploy dist/panel/browser --project-name=neversion --branch=main
